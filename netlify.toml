[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # SUPABASE_URL and SUPABASE_ANON_KEY are also set as Netlify env vars (for the
  # Netlify Functions that need them) but are intentionally hardcoded in app.html
  # too — Supabase's anon/publishable key is designed to be public client-side;
  # Row Level Security is what actually protects data, not hiding this value.
  # Netlify's secret scanner doesn't know that and fails the build the moment it
  # sees an env var's value inside the deployed bundle. Omit just these two by
  # name so scanning stays ON for every real secret (STRIPE_SECRET_KEY,
  # ANTHROPIC_API_KEY, DATABENTO_API_KEY, ALPHAVANTAGE_API_KEY,
  # SUPABASE_SERVICE_ROLE_KEY, STRIPE_WEBHOOK_SECRET).
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[[redirects]]
  from = "/profxtrading.html"
  to = "/"
  status = 301
  force = true

# Friendly URL for the app. The signed-in application lives at /app.html
# (index.html is now the public marketing page); /app rewrites to it so links
# and bookmarks can use the clean path. 200 = rewrite (URL stays /app), not a
# visible redirect.
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"
